name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository and metadata
        run: python -X utf8 scripts/validate_repository.py

      - name: Run incremental public regression
        run: >
          python -X utf8 scripts/run_incremental_tests.py
          --pattern "test_p10_*.py"
          --pattern "test_p11_*.py"
          --pattern "test_p12_*.py"
          --pattern "test_p13_*.py"
          --pattern "test_p14_*.py"
          --pattern "test_p16_*.py"
          --pattern "test_p17_*.py"
          --pattern "test_p18_*.py"
          --pattern "test_experiment_metrics.py"
          --pattern "test_education_profiles.py"
          --pattern "test_cross_platform.py"
          --pattern "test_subagent_delegation.py"
          --pattern "test_resource_task_planning.py"
          --pattern "test_direction_exploration.py"
          --suite github-ci
          --no-resume

      - name: Build platform migration archive
        run: python -X utf8 scripts/build_modular_package.py --platform ${{ matrix.platform }} --output dist/research-guard-${{ matrix.platform }}.zip

      - name: Validate POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh scripts/mcp.sh
