name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository and metadata
        run: python -X utf8 scripts/validate_repository.py

      - name: Test optional Research Console add-on
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s addons/research-console/tests -v

      - name: Run incremental public regression
        run: >
          python -X utf8 scripts/run_incremental_tests.py
          --pattern "test_p10_*.py"
          --pattern "test_p11_*.py"
          --pattern "test_p12_*.py"
          --pattern "test_p13_*.py"
          --pattern "test_p14_*.py"
          --pattern "test_p16_*.py"
          --pattern "test_p17_*.py"
          --pattern "test_p18_*.py"
          --pattern "test_experiment_metrics.py"
          --pattern "test_education_profiles.py"
          --pattern "test_cross_platform.py"
          --pattern "test_subagent_delegation.py"
          --pattern "test_resource_task_planning.py"
          --pattern "test_direction_exploration.py"
          --pattern "test_p21_*.py"
          --pattern "test_p22_*.py"
          --pattern "test_p24_*.py"
          --pattern "test_p25_*.py"
          --pattern "test_documentation_parity.py"
          --suite github-ci
          --no-resume

      - name: Hydrate audited Windows release payloads
        if: runner.os == 'Windows'
        run: python -X utf8 scripts/hydrate_release_payloads.py

      - name: Build platform migration archive
        run: python -X utf8 scripts/build_modular_package.py --platform ${{ matrix.platform }} --output dist/research-guard-${{ matrix.platform }}.zip

      - name: Build separate optional Research Console archive
        if: runner.os == 'Linux'
        run: python -X utf8 addons/research-console/build_addon.py --output dist/research-guard-ui-addon.zip --checksum-output dist/SHA256SUMS-ui.txt

      - name: Validate POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh scripts/mcp.sh

      - name: Verify isolated platform installation
        run: >
          python -X utf8 scripts/test_isolated_install.py
          --archive dist/research-guard-${{ matrix.platform }}.zip
          --test-root build/ci-isolated-${{ matrix.platform }}
          --pip-index-url https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Retain verified migration archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/research-guard-${{ matrix.platform }}.zip
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Retain verified optional Research Console archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: research-guard-ui-addon
          path: dist/research-guard-ui-addon.zip
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Retain optional Research Console checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: research-guard-ui-checksum
          path: dist/SHA256SUMS-ui.txt
          archive: false
          retention-days: 3
          if-no-files-found: error
