name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository and metadata
        run: python -X utf8 scripts/validate_repository.py

      - name: Run incremental public regression
        run: >
          python -X utf8 scripts/run_incremental_tests.py
          --pattern "test_p10_*.py"
          --pattern "test_p11_*.py"
          --pattern "test_p12_*.py"
          --pattern "test_p13_*.py"
          --pattern "test_p14_*.py"
          --pattern "test_p16_*.py"
          --suite github-ci
          --no-resume

      - name: Build GitHub-safe source archive
        run: python -X utf8 scripts/build_public_package.py --output dist/research-guard-source.zip
