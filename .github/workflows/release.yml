name: Release source archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository and metadata
        run: python -X utf8 scripts/validate_repository.py

      - name: Run deterministic release regression
        run: >
          python -X utf8 scripts/run_incremental_tests.py
          --pattern "test_p10_*.py"
          --pattern "test_p11_*.py"
          --pattern "test_p12_*.py"
          --pattern "test_p13_*.py"
          --pattern "test_p14_*.py"
          --pattern "test_p16_*.py"
          --pattern "test_p17_*.py"
          --pattern "test_p18_*.py"
          --pattern "test_experiment_metrics.py"
          --pattern "test_education_profiles.py"
          --pattern "test_cross_platform.py"
          --pattern "test_subagent_delegation.py"
          --pattern "test_resource_task_planning.py"
          --pattern "test_direction_exploration.py"
          --pattern "test_p21_*.py"
          --pattern "test_p22_*.py"
          --pattern "test_documentation_parity.py"
          --suite github-release
          --no-resume

      - name: Build POSIX migration archives
        run: |
          python -X utf8 scripts/build_modular_package.py --platform linux-x64 --output dist/research-guard-linux-x64.zip
          python -X utf8 scripts/build_modular_package.py --platform macos-x64 --output dist/research-guard-macos-x64.zip
          python -X utf8 scripts/build_modular_package.py --platform macos-arm64 --output dist/research-guard-macos-arm64.zip
          cd dist
          sha256sum research-guard-linux-x64.zip research-guard-macos-x64.zip research-guard-macos-arm64.zip > SHA256SUMS-posix.txt

      - name: Verify isolated Linux release archive
        run: >
          python -X utf8 scripts/test_isolated_install.py
          --archive dist/research-guard-linux-x64.zip
          --test-root build/release-isolated-linux-x64
          --pip-index-url https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Publish GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Research Guard $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/research-guard-linux-x64.zip \
            dist/research-guard-macos-x64.zip \
            dist/research-guard-macos-arm64.zip \
            dist/SHA256SUMS-posix.txt
